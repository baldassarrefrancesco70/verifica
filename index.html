<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Verifica</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1f1d1a; --muted: #6b665e;
    --accent: #8d3535; --accent-ink: #ffffff; --line: #e2ddd3;
    --ok: #2f7d4f; --warn: #b5651d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #181715; --card: #23211e; --ink: #f1ede6; --muted: #a8a197;
            --line: #36332e; --accent: #c45a5a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  /* Schermata iniziale */
  #intro { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    max-width: 460px; width: 100%; padding: 24px 20px; }
  h1 { font-size: 1.25rem; line-height: 1.3; margin: 0 0 12px; }
  .note { color: var(--muted); font-size: .95rem; margin: 0 0 12px; }
  .code-box { margin: 18px 0; padding: 14px; border: 1px dashed var(--line); border-radius: 10px; text-align: center; }
  .code-box span { display: block; font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .code-box strong { font: 700 2rem/1.2 ui-monospace, Menlo, monospace; letter-spacing: .2em; }
  button { width: 100%; padding: 14px; border: 0; border-radius: 10px; background: var(--accent);
    color: var(--accent-ink); font: 600 1rem system-ui, sans-serif; cursor: pointer; }
  .err { color: var(--accent); font-weight: 600; }

  /* Schermata della verifica */
  #test { display: none; height: 100%; flex-direction: column; }
  #bar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 16px;
    padding-top: max(8px, env(safe-area-inset-top)); background: var(--card);
    border-bottom: 1px solid var(--line); font-size: .85rem; }
  #bar .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: 0 0 auto; }
  #bar .lbl { color: var(--muted); }
  #bar .code { margin-left: auto; font: 700 .95rem ui-monospace, Menlo, monospace; letter-spacing: .12em; }
  #frame { flex: 1 1 auto; width: 100%; border: 0; background: #fff; }
</style>
</head>
<body>

<section id="intro">
  <div class="card">
    <h1 id="titolo">Verifica</h1>
    <p class="note">Resta su questa pagina fino all'invio del modulo.</p>
    <div class="code-box"><span>Il tuo codice di sessione</span><strong id="codice">····</strong></div>
    <p class="note" id="nota-codice"></p>
    <button id="inizia" type="button">Inizia la verifica</button>
    <p class="err" id="errore" hidden></p>
  </div>
</section>

<section id="test">
  <div id="bar"><span class="dot"></span><span class="lbl">Verifica in corso</span><span class="code" id="codice-bar"></span></div>
  <iframe id="frame" title="Modulo della verifica" allow="clipboard-write"></iframe>
</section>

<script>
/* ============================================================
   CONFIGURAZIONE — l'unica parte da modificare
   ============================================================ */
const CONFIG = {
  // URL della app web di Apps Script (finisce con /exec)
  endpoint: "https://script.google.com/macros/s/AKfycbw2bJddycMTvvxY1zI1nsUJXh1uZ_CchEMUsuosCrqIQ30uTtqK5Mvyi8-5D5AU_I-2/exec",

  // Verifica usata quando il link non specifica ?v=...
  predefinita: "rivoluzione-scientifica",

  verifiche: {
    "rivoluzione-scientifica": {
      titolo: "La Rivoluzione scientifica – Verifica scritta",
      // ID del modulo: la parte tra /d/e/ e /viewform
      form: "1FAIpQLScHWXx-Eu9y0cdjshUxCfGcRDAVJy25Hm0fUpa_TUO1A7iDkg",
      // ID della domanda «Codice di sessione», es. "entry.123456789".
      // Se resta vuoto, lo studente deve copiare il codice a mano.
      entryCodice: "1507669218"
    }
  }
};
/* ============================================================ */

(function () {
  const params = new URLSearchParams(location.search);
  const chiave = params.get("v") || CONFIG.predefinita;
  const verifica = CONFIG.verifiche[chiave];
  const $ = (id) => document.getElementById(id);

  if (!verifica) {
    $("titolo").textContent = "Verifica non trovata";
    $("inizia").hidden = true;
    $("errore").hidden = false;
    $("errore").textContent = "Il link non è corretto. Chiedi al docente il link giusto.";
    return;
  }

  // ---------- memoria locale (protetta: può mancare) ----------
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const KEY_SESS = "launcher:" + chiave;
  const KEY_CODA = "launcher:coda";

  // ---------- codice di sessione ----------
  const ALFABETO = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  function nuovoCodice() {
    const a = new Uint32Array(4);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.from(a, (n) => ALFABETO[n % ALFABETO.length]).join("");
  }
  let sessione = store.get(KEY_SESS);
  const riapertura = !!(sessione && sessione.codice);
  if (!riapertura) {
    sessione = { codice: nuovoCodice(), avviata: false };
    store.set(KEY_SESS, sessione);
  }
  const codice = sessione.codice;

  $("titolo").textContent = verifica.titolo;
  document.title = verifica.titolo;
  $("codice").textContent = codice;
  $("codice-bar").textContent = codice;
  $("nota-codice").textContent = verifica.entryCodice
    ? "Il codice viene inserito da solo nel modulo: non modificarlo."
    : "Scrivi questo codice nella domanda «Codice di sessione» del modulo.";

  // ---------- invio degli eventi ----------
  const ua = (navigator.userAgent || "").slice(0, 180);
  function payload(evento, extra) {
    return Object.assign({
      verifica: chiave, codice: codice, evento: evento,
      ora: new Date().toISOString(), durata: "", dettaglio: "", ua: ua
    }, extra || {});
  }
  function spedisci(p) {
    const body = JSON.stringify(p);
    let ok = false;
    try {
      if (navigator.sendBeacon) ok = navigator.sendBeacon(CONFIG.endpoint, new Blob([body], { type: "text/plain" }));
    } catch (e) {}
    if (!ok) {
      try {
        fetch(CONFIG.endpoint, { method: "POST", mode: "no-cors", keepalive: true,
          headers: { "Content-Type": "text/plain" }, body: body });
        ok = true;
      } catch (e) {}
    }
    return ok;
  }
  function registra(evento, extra) {
    const p = payload(evento, extra);
    if (!navigator.onLine || !spedisci(p)) {
      const coda = store.get(KEY_CODA) || [];
      coda.push(p); store.set(KEY_CODA, coda.slice(-200));
    }
  }
  function svuotaCoda() {
    const coda = store.get(KEY_CODA) || [];
    if (!coda.length || !navigator.onLine) return;
    store.set(KEY_CODA, []);
    coda.forEach((p) => { p.dettaglio = (p.dettaglio ? p.dettaglio + " · " : "") + "inviato in ritardo"; spedisci(p); });
  }
  window.addEventListener("online", svuotaCoda);

  // ---------- rilevamento delle uscite ----------
  let attiva = false;
  let uscitaDa = null;
  let nUscite = 0;

  document.addEventListener("visibilitychange", () => {
    if (!attiva) return;
    if (document.visibilityState === "hidden") {
      uscitaDa = Date.now();
      nUscite += 1;
      registra("uscita", { dettaglio: "uscita n. " + nUscite });
    } else if (uscitaDa !== null) {
      const sec = Math.round((Date.now() - uscitaDa) / 1000);
      uscitaDa = null;
      registra("rientro", { durata: sec, dettaglio: "uscita n. " + nUscite });
      svuotaCoda();
    }
  });

  // ---------- caricamento del modulo ----------
  let caricamenti = 0;
  $("frame").addEventListener("load", () => {
    caricamenti += 1;
    if (caricamenti > 1) registra("pagina_modulo", { dettaglio: "caricamento n. " + caricamenti });
  });

  function urlModulo() {
    let u = "https://docs.google.com/forms/d/e/" + encodeURIComponent(verifica.form) + "/viewform?embedded=true";
    if (verifica.entryCodice) {
      const id = String(verifica.entryCodice).replace(/^entry\./, "");
      u += "&entry." + encodeURIComponent(id) + "=" + encodeURIComponent(codice);
    }
    return u;
  }

  function avvia() {
    $("intro").style.display = "none";
    $("test").style.display = "flex";
    $("frame").src = urlModulo();
    attiva = true;
    registra(riapertura && sessione.avviata ? "riapertura" : "avvio");
    sessione.avviata = true; store.set(KEY_SESS, sessione);
    svuotaCoda();
  }

  if (CONFIG.endpoint.indexOf("http") !== 0) {
    $("errore").hidden = false;
    $("errore").textContent = "Configurazione incompleta: manca l'indirizzo del registro.";
  }
  $("inizia").addEventListener("click", avvia);
})();
</script>
</body>
</html>
